[project]
name = "whilefresh-tools"
version = "0.1.0"
description = "Offline data tools for the WhileFresh app"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
assets = ["fonttools>=4.50", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whilefresh_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
